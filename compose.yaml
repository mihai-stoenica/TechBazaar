services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techbazaar_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "mysql://root:secret@database:3306/techbazaar?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      - database
    command: php -S 0.0.0.0:8000 -t public/

  database:
    image: mysql:8.0
    container_name: techbazaar_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: techbazaar
    ports:
      - "33069:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
